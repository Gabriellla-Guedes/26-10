<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-login">
        <h2>Cadastro</h2>

        <form id="cadastroForm">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha"
                placeholder="Crie uma senha" minlength="8" required>

            <label for="confirmar">Confirmar senha:</label>
            <input type="password" id="confirmar"
                placeholder="Confirme sua senha" minlength="8" required>

            <button type="submit">Cadastrar</button>
            <p id="mensagem" role="status"></p>
        </form>

        <p>Já tem conta? <a href="login.html">Entrar</a></p>
    </div>

    <script>
        const formulario = document.getElementById("cadastroForm");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const senha = document.getElementById("senha").value;
            const confirmar = document.getElementById("confirmar").value;
            const mensagem = document.getElementById("mensagem");

            mensagem.textContent = "";

            if (nome.length < 2) {
                mensagem.textContent = "Digite um nome válido.";
                return;
            }

            if (senha.length < 8) {
                mensagem.textContent = "A senha deve ter pelo menos 8 caracteres.";
                return;
            }

            if (senha !== confirmar) {
                mensagem.textContent = "As senhas não coincidem.";
                return;
            }

            let usuarios = [];

            try {
                usuarios = JSON.parse(
                    localStorage.getItem("usuarios") || "[]"
                );

                if (!Array.isArray(usuarios)) {
                    usuarios = [];
                }
            } catch {
                mensagem.textContent = "Erro ao consultar os cadastros.";
                return;
            }

            const existente = usuarios.some(
                usuario => usuario.email === email
            );

            if (existente) {
                mensagem.textContent = "Este e-mail já está cadastrado.";
                return;
            }

            usuarios.push({ nome, email, senha });

            try {
                localStorage.setItem("usuarios", JSON.stringify(usuarios));
                alert("Cadastro criado com sucesso! Faça seu login.");
                window.location.href = "login.html";
            } catch {
                mensagem.textContent = "Não foi possível salvar o cadastro.";
            }
        });
    </script>
</body>
</html>
