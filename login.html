<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-login">
        <h2>Login</h2>

        <form id="loginForm">
            <label for="email">E-mail:</label>
            <input type="email" id="email"
                   placeholder="Digite seu e-mail" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha"
                   placeholder="Digite sua senha" required>

            <button type="submit">Entrar</button>
            <p id="mensagem" role="status"></p>
        </form>

        <p>Não tem conta? <a href="cadastro.html">Cadastrar</a></p>
    </div>

    <script>
        const formulario = document.getElementById("loginForm");
        const mensagem = document.getElementById("mensagem");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email")
                .value.trim().toLowerCase();
            const senha = document.getElementById("senha").value;

            mensagem.textContent = "";

            let usuarios;
            let tentativas;
            let bloqueios;

            try {
                usuarios = JSON.parse(
                    localStorage.getItem("usuarios") || "[]"
                );
                tentativas = JSON.parse(
                    localStorage.getItem("tentativasLogin") || "{}"
                );
                bloqueios = JSON.parse(
                    localStorage.getItem("bloqueiosLogin") || "{}"
                );
            } catch {
                mensagem.textContent = "Erro ao consultar os dados.";
                return;
            }

            const agora = Date.now();

            // Verifica se o e-mail está bloqueado.
            if (bloqueios[email] && agora < bloqueios[email]) {
                const segundos = Math.ceil(
                    (bloqueios[email] - agora) / 1000
                );

                mensagem.textContent =
                    `Acesso bloqueado. Tente novamente em ${segundos} segundos.`;
                return;
            }

            // Remove bloqueios que já expiraram.
            if (bloqueios[email] && agora >= bloqueios[email]) {
                delete bloqueios[email];
                tentativas[email] = 0;
            }

            const usuario = usuarios.find(
                u => u.email === email && u.senha === senha
            );

            if (!usuario) {
                tentativas[email] = (tentativas[email] || 0) + 1;

                if (tentativas[email] >= 5) {
                    bloqueios[email] = Date.now() + 2 * 60 * 1000;
                    tentativas[email] = 0;

                    try {
                        localStorage.setItem(
                            "bloqueiosLogin", JSON.stringify(bloqueios)
                        );
                        localStorage.setItem(
                            "tentativasLogin", JSON.stringify(tentativas)
                        );
                    } catch {
                        mensagem.textContent = "Erro ao salvar o bloqueio.";
                        return;
                    }

                    mensagem.textContent =
                        "Cinco tentativas incorretas. Acesso bloqueado por 2 minutos.";
                    return;
                }

                try {
                    localStorage.setItem(
                        "tentativasLogin", JSON.stringify(tentativas)
                    );
                } catch {
                    mensagem.textContent = "Erro ao registrar a tentativa.";
                    return;
                }

                mensagem.textContent =
                    `E-mail ou senha incorretos. Tentativa ${tentativas[email]} de 5.`;
                return;
            }

            // Login correto: limpa as tentativas e inicia a sessão.
            delete tentativas[email];
            delete bloqueios[email];

            try {
                localStorage.setItem(
                    "tentativasLogin", JSON.stringify(tentativas)
                );
                localStorage.setItem(
                    "bloqueiosLogin", JSON.stringify(bloqueios)
                );

                sessionStorage.setItem("usuarioLogado", JSON.stringify({
                    nome: usuario.nome,
                    email: usuario.email
                }));

                alert("Login realizado com sucesso!");
                window.location.href = "painel.html";
            } catch {
                mensagem.textContent =
                    "Não foi possível iniciar a sessão.";
            }
        });
    </script>
</body>
</html>
