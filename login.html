
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #96759a;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .caixa-login {
            background-color: white;
            width: 280px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        form label {
            display: block;
            margin: 12px 0 5px;
            font-size: 14px;
        }

        form input {
            display: block;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .link-esqueci {
            display: block;
            text-align: right;
            margin-top: 10px;
            font-size: 12px;
            color: #0066cc;
            text-decoration: none;
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #e39fd2;
        }

        p {
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="caixa-login">
        <h2>Login</h2>

        <form id="loginForm">
            <label for="email">E-mail:</label>
            <input type="email" id="email"
                placeholder="Digite seu e-mail" required>

            <label for="senha">Senha:</label>
            <input type="password" minlength="8"  id="senha" placeholder="Digite sua senha" required>

            <a href="#" class="link-esqueci"
            onclick="alert('Entre em contato com o responsável pelo site para recuperar sua senha.'); return false;">
                Esqueci minha senha
            </a>

            <button type="submit">Entrar</button>
        </form>

        <p>
            Não tem conta?
            <a href="cadastro.html">Cadastrar</a>
        </p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            if (email === "teste@gmail.com" && senha === "123") {
                alert("Login realizado com sucesso!");
            } else {
                alert("E-mail ou senha incorretos!");
            }
        });
    </script>

</body>
</html>
